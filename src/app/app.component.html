<mat-toolbar class="main-navbar">
  <div class="brand-title">
    <mat-icon class="brand-icon">space_dashboard</mat-icon>
    <span>{{ title }}</span>
  </div>

  <nav class="nav-links">
    <a
      *ngFor="let item of activeItems"
      [routerLink]="item.to"
      routerLinkActive="active-link"
      mat-button
      class="nav-item">
      {{ item.label | translate }}
    </a>
  </nav>

  <span class="spacer"></span>

  <div class="nav-actions">
    <!-- Language Switcher -->
    <app-language-switcher/>

    <div class="auth-group">
      <!-- Sign In Button -->
      <button mat-button class="btn-auth btn-outline" (click)="goToSignIn()">
        Sign In
      </button>

      <!-- Sign Up Button -->
      <button mat-flat-button class="btn-auth btn-filled" (click)="goToSignUp()">
        Sign Up
      </button>
    </div>
  </div>
</mat-toolbar>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
