<div class="page-container">
  <h1>Inventario del Técnico</h1>
  <p>ID del Técnico: <strong>{{ technicianId }}</strong></p>

  <div *ngIf="notFoundMessage" class="error-message">
    <p>{{ notFoundMessage }}</p>
  </div>

  <div *ngIf="!notFoundMessage" class="grid-container">
    <div class="form-section">
      <app-technician-inventory-form
        (itemAdded)="onAddItem($event)">
      </app-technician-inventory-form>
    </div>

    <div class="list-section">
      <app-inventory-list
        [inventoryItems]="inventory?.stockItems"
        [isLoading]="isLoading"
        (updateQuantity)="onUpdateQuantity($event)"
        (removeItem)="onRemoveItem($event)">
      </app-inventory-list>
    </div>
  </div>
</div>
