<div class="layout-wrapper">
  <!-- Sidebar Izquierda Desplegable con Tarjetas -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <mat-icon class="logo-icon">electric_bolt</mat-icon>
        <span class="logo-text">Menu</span>
      </div>
    </div>

    <!-- Navegación con Tarjetas (Cards) -->
    <nav class="sidebar-nav">
      <a
        *ngFor="let item of activeItems"
        [routerLink]="item.to"
        routerLinkActive="active"
        class="nav-card">
        <div class="card-icon-wrapper">
          <mat-icon class="card-icon">{{ item.icon || 'grid_view' }}</mat-icon>
        </div>
        <div class="card-info">
          <span class="card-title">{{ item.label }}</span>
        </div>
        <mat-icon class="arrow-icon">chevron_right</mat-icon>
      </a>
    </nav>
  </aside>

  <!-- Área Principal -->
  <div class="main-layout">
    <header class="top-banner">
      <h1 class="banner-title">Menú principal {{ isBuyer ? 'Cliente' : 'Técnico' }}</h1>

      <button
        mat-flat-button
        class="switch-btn"
        (click)="switchView()"
        [disabled]="!isAuthenticated">
        <mat-icon>sync</mat-icon>
        <span>{{ changeLabel }}</span>
      </button>
    </header>

    <main class="dashboard-content">
      <h2 class="welcome-title">Bienvenido, <span class="highlight">{{ userName }}</span></h2>
      <p class="welcome-subtitle">Selecciona cualquiera de las secciones en el panel izquierdo para empezar.</p>
    </main>
  </div>
</div>
